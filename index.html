    function renderParentView() {
      const vp = document.getElementById('mainViewport');
      const seoul = getSeoulNowParts();

      vp.innerHTML = `
        <div class="subview-container">
          <div class="section-header-bar">
            <h1 class="section-title">⚙️ 부모님 관리 모드</h1>

          </div>

          <div class="parent-nav-tabs">
            <button type="button" class="parent-tab-btn ${parentSubTab === 'today' ? 'active' : ''}" data-ptab="today">📊 오늘 현황 · 통계</button>
            <button type="button" class="parent-tab-btn ${parentSubTab === 'routines' ? 'active' : ''}" data-ptab="routines">📋 루틴 · 스페셜 미션</button>
            <button type="button" class="parent-tab-btn ${parentSubTab === 'dex' ? 'active' : ''}" data-ptab="dex">🗺️ 도감 · 옷장 별 설정</button>
            <button type="button" class="parent-tab-btn ${parentSubTab === 'reminders' ? 'active' : ''}" data-ptab="reminders">🔔 알림 팝업</button>
            <button type="button" class="parent-tab-btn ${parentSubTab === 'rewards' ? 'active' : ''}" data-ptab="rewards">🎁 보상 관리</button>
            <button type="button" class="parent-tab-btn ${parentSubTab === 'schedule' ? 'active' : ''}" data-ptab="schedule">📅 등원복 · 일정</button>
            <button type="button" class="parent-tab-btn ${parentSubTab === 'letters' ? 'active' : ''}" data-ptab="letters">💌 칭찬 편지</button>
            <button type="button" class="parent-tab-btn ${parentSubTab === 'settings' ? 'active' : ''}" data-ptab="settings">☁️ 동기화 · 설정</button>
          </div>

          <div id="parentTabBody" style="display:flex; flex-direction:column; gap:14px;"></div>
        </div>
      `;

      document.getElementById('lockParentModeBtn').onclick = () => {
        parentUnlocked = false;
        navigateTo('today');
      };

      vp.querySelectorAll('[data-ptab]').forEach(btn => {
        btn.onclick = () => {
          parentSubTab = btn.dataset.ptab;
          renderParentView();
        };
      });

      const body = document.getElementById('parentTabBody');
      if (parentSubTab === 'today') renderParentTodayTab(body, seoul);
      else if (parentSubTab === 'routines') renderParentRoutinesTab(body, seoul);
      else if (parentSubTab === 'dex') renderParentDexTab(body);
      else if (parentSubTab === 'reminders') renderParentRemindersTab(body);
      else if (parentSubTab === 'rewards') renderParentRewardsTab(body, seoul);
      else if (parentSubTab === 'schedule') renderParentScheduleTab(body, seoul);
      else if (parentSubTab === 'letters') renderParentLettersTab(body);
      else if (parentSubTab === 'settings') renderParentSettingsTab(body);
    }

                        <div style="font-size:11.5px; color:var(--sage-main); font-weight:800;">그림: ${escapeHTML(currentLabel)}</div>
                      </div>
                    </div>
                    <div style="display:flex; gap:5px; flex-wrap:wrap;">
                      <button type="button" class="soft-action-btn" style="padding:5px 10px; background:var(--sage-soft);" data-start-edit-task="${taskKey}">✏️ 수정</button>
                      <button type="button" class="soft-action-btn" style="padding:5px 9px;" data-move-task="${rt.id}:${idx}:-1">▲</button>
                      <button type="button" class="soft-action-btn" style="padding:5px 9px;" data-move-task="${rt.id}:${idx}:1">▼</button>
                      <button type="button" class="danger-btn" data-del-task="${rt.id}:${t.id}">삭제</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <form data-add-task-form="${rt.id}" style="background:var(--bg-card-alt); padding:12px; border-radius:14px; display:flex; flex-direction:column; gap:10px;">
              <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <div data-add-preview="${rt.id}" style="width:44px; height:44px; border-radius:12px; background:#FFFDF6; border:1.5px solid var(--border-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                  ${renderActionSVG('eat').replace('width="104" height="104"', 'width="40" height="40"')}
                </div>
                <input type="text" name="title" class="input-ctrl" style="flex:1; min-width:160px;" data-add-title-input="${rt.id}" placeholder="새 할 일 이름 (예: 비타민 먹기)" required />
                <input type="number" name="stars" class="input-ctrl" style="width:74px;" value="1" min="1" max="5" />
                <button type="submit" class="primary-btn">+ 할 일 추가</button>
              </div>
              <div>
                <div style="font-size:12px; font-weight:800; color:var(--text-secondary); margin-bottom:5px;">치이카와 액션 그림 선택 (그림을 직접 눌러 고르세요)</div>
                <input type="hidden" name="illus" data-add-illus-input="${rt.id}" value="eat" />
                ${renderIllusPickerGrid(`add_${rt.id}`, 'eat')}
              </div>
            </form>
          </div>
        `).join('')}
      `;

      container.querySelectorAll('[data-sp-preset]').forEach(btn => {
        btn.onclick = () => {
          const p = specialPresets[Number(btn.dataset.spPreset)];
          if (!p) return;
          state.specialMissions = state.specialMissions || [];
          state.specialMissions.push({ id: uid('sp'), dateKey: seoul.dateKey, title: p.title, illus: p.illus, stars: p.stars, completedAt: null });
          persistState();
          renderParentView();
          showToast(`✨ '${p.title}' 스페셜 미션이 추가되었습니다!`);
        };
      });

      document.getElementById('addSpecialMissionForm').onsubmit = e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        state.specialMissions = state.specialMissions || [];
        state.specialMissions.push({
          id: uid('sp'),
          dateKey: seoul.dateKey,
          title: String(fd.get('title')).trim(),
          illus: String(fd.get('illus') || 'hugStar'),
          stars: Math.max(1, Number(fd.get('stars')) || 2),
          completedAt: null
        });
        persistState();
        renderParentView();
        showToast('✨ 오늘의 스페셜 미션이 등록되었습니다!');
      };

      const selectIllusInPicker = (pickerId, illusKey) => {
        const grid = container.querySelector(`[data-illus-picker="${pickerId}"]`);
        if (!grid) return;
        grid.querySelectorAll('[data-pick-illus]').forEach(btn => {
          const raw = btn.dataset.pickIllus || '';
          const k = raw.slice(raw.lastIndexOf(':') + 1);
          const active = k === illusKey;
          btn.style.borderColor = active ? 'var(--sage-main)' : 'transparent';
          btn.style.background = active ? 'var(--sage-soft)' : 'var(--bg-card-alt)';
        });
      };

      container.querySelectorAll('[data-pick-illus]').forEach(btn => {
        btn.onclick = () => {
          const raw = btn.dataset.pickIllus || '';
          const lastColonIdx = raw.lastIndexOf(':');
          const pickerId = raw.slice(0, lastColonIdx);
          const illusKey = raw.slice(lastColonIdx + 1);
          selectIllusInPicker(pickerId, illusKey);

          if (pickerId === 'special') {
            const hidden = document.getElementById('specialMissionIllusInput');
            if (hidden) {
              hidden.value = illusKey;
              hidden.dataset.userPicked = '1';
            }
          } else if (pickerId.startsWith('add_')) {
            const rtId = pickerId.slice(4);
            const hidden = container.querySelector(`[data-add-illus-input="${rtId}"]`);
            if (hidden) {
              hidden.value = illusKey;
              hidden.dataset.userPicked = '1';
            }
            const previewBox = container.querySelector(`[data-add-preview="${rtId}"]`);
            if (previewBox) {
              previewBox.innerHTML = renderActionSVG(illusKey).replace('width="104" height="104"', 'width="40" height="40"');
            }
          } else if (pickerId.startsWith('edit_')) {
            const taskKey = pickerId.slice(5);
            const hidden = container.querySelector(`[data-edit-illus-input="${taskKey}"]`);
            if (hidden) hidden.value = illusKey;
            const previewBox = container.querySelector(`[data-edit-preview="${taskKey}"]`);
            if (previewBox) {
              previewBox.innerHTML = renderActionSVG(illusKey).replace('width="104" height="104"', 'width="46" height="46"');
            }
          }
        };
      });

      const spTitleInput = document.getElementById('specialMissionTitleInput');
      if (spTitleInput) {
        spTitleInput.oninput = () => {
          const hidden = document.getElementById('specialMissionIllusInput');
          if (!hidden || hidden.dataset.userPicked === '1') return;
          const inferred = inferActionIllusFromTitle(spTitleInput.value);
          if (inferred && hidden.value !== inferred) {
            hidden.value = inferred;
            selectIllusInPicker('special', inferred);
          }
        };
      }

      container.querySelectorAll('[data-del-special]').forEach(btn => {
        btn.onclick = () => {
          state.specialMissions = (state.specialMissions || []).filter(sm => sm.id !== btn.dataset.delSpecial);
          persistState();
          renderParentView();
          showToast('스페셜 미션이 삭제되었습니다.');
        };
      });

      const addRtForm = document.getElementById('addRoutineCategoryForm');
      if (addRtForm) {
        addRtForm.onsubmit = e => {
          e.preventDefault();
          const fd = new FormData(e.target);
          state.routines = state.routines || [];
          state.routines.push({
            id: uid('rt'),
            name: String(fd.get('name')).trim(),
            emoji: String(fd.get('emoji') || '🌈').trim(),
            startTime: String(fd.get('startTime') || '09:00'),
            targetTime: String(fd.get('targetTime') || '11:00'),
            daysOfWeek: [0, 1, 2, 3, 4, 5, 6],
            enabled: true,
            tasks: []
          });
          persistState();
          renderParentView();
          showToast('새 루틴 카테고리가 추가되었습니다!');
        };
      }

      container.querySelectorAll('[data-toggle-rt]').forEach(btn => {
        btn.onclick = () => {
          const rt = (state.routines || []).find(r => r.id === btn.dataset.toggleRt);
          if (!rt) return;
          rt.enabled = rt.enabled === false ? true : false;
          persistState();
          renderParentView();
        };
      });

      container.querySelectorAll('[data-move-rt]').forEach(btn => {
        btn.onclick = () => {
          const [idxStr, dirStr] = btn.dataset.moveRt.split(':');
          const idx = Number(idxStr);
          const nextIdx = idx + Number(dirStr);
          if (nextIdx < 0 || nextIdx >= state.routines.length) return;
          const [moved] = state.routines.splice(idx, 1);
          state.routines.splice(nextIdx, 0, moved);
          persistState();
          renderParentView();
        };
      });

      container.querySelectorAll('[data-del-rt]').forEach(btn => {
        btn.onclick = () => {
          if ((state.routines || []).length <= 1) {
            showToast('최소 1개의 루틴은 남겨두어야 합니다.');
            return;
          }
          state.routines = state.routines.filter(r => r.id !== btn.dataset.delRt);
          persistState();
          renderParentView();
          showToast('루틴 카테고리가 삭제되었습니다.');
        };
      });

      container.querySelectorAll('[data-rt-time-form]').forEach(form => {
        form.onsubmit = e => {
          e.preventDefault();
          const rt = (state.routines || []).find(r => r.id === form.dataset.rtTimeForm);
          if (!rt) return;
          const fd = new FormData(form);
          rt.emoji = String(fd.get('emoji') || rt.emoji || '🌱').trim();
          rt.name = String(fd.get('name') || rt.name).trim();
          rt.startTime = String(fd.get('startTime') || rt.startTime);
          rt.targetTime = String(fd.get('targetTime') || rt.targetTime);
          persistState();
          renderParentView();
          showToast(`${rt.name} 설정이 저장되었습니다.`);
        };
      });

      container.querySelectorAll('[data-move-task]').forEach(btn => {
        btn.onclick = () => {
          const [rtId, idxStr, dirStr] = btn.dataset.moveTask.split(':');
          const rt = (state.routines || []).find(r => r.id === rtId);
          if (!rt) return;
          const idx = Number(idxStr);
          const nextIdx = idx + Number(dirStr);
          if (nextIdx < 0 || nextIdx >= rt.tasks.length) return;
          const [moved] = rt.tasks.splice(idx, 1);
          rt.tasks.splice(nextIdx, 0, moved);
          persistState();
          renderParentView();
        };
      });

      container.querySelectorAll('[data-del-task]').forEach(btn => {
        btn.onclick = () => {
          const [rtId, tId] = btn.dataset.delTask.split(':');
          const rt = (state.routines || []).find(r => r.id === rtId);
          if (!rt) return;
          rt.tasks = rt.tasks.filter(t => t.id !== tId);
          persistState();
          renderParentView();
          showToast('할 일이 삭제되었습니다.');
        };
      });

      container.querySelectorAll('[data-start-edit-task]').forEach(btn => {
        btn.onclick = () => {
          editingTaskKey = btn.dataset.startEditTask;
          renderParentView();
        };
      });

      container.querySelectorAll('[data-cancel-edit-task]').forEach(btn => {
        btn.onclick = () => {
          editingTaskKey = null;
          renderParentView();
        };
      });

      container.querySelectorAll('[data-edit-task-form]').forEach(form => {
        form.onsubmit = e => {
          e.preventDefault();
          const taskKey = form.dataset.editTaskForm;
          const [rtId, tId] = taskKey.split(':');
          const rt = (state.routines || []).find(r => r.id === rtId);
          const task = rt && (rt.tasks || []).find(t => t.id === tId);
          if (!task) return;
          const fd = new FormData(form);
          const hiddenInput = form.querySelector(`[data-edit-illus-input="${taskKey}"]`);
          task.title = String(fd.get('title')).trim();
          task.illus = (hiddenInput && hiddenInput.value) || String(fd.get('illus') || 'eat');
          task.stars = Math.max(1, Number(fd.get('stars')) || 1);
          editingTaskKey = null;
          persistState();
          renderParentView();
          showToast('할 일 이름과 액션 그림이 수정되었습니다!');
        };
      });

      container.querySelectorAll('[data-add-title-input]').forEach(inp => {
        inp.oninput = () => {
          const rtId = inp.dataset.addTitleInput;
          const hidden = container.querySelector(`[data-add-illus-input="${rtId}"]`);
          if (!hidden || hidden.dataset.userPicked === '1') return;
          const inferred = inferActionIllusFromTitle(inp.value);
          if (inferred && hidden.value !== inferred) {
            hidden.value = inferred;
            selectIllusInPicker(`add_${rtId}`, inferred);
            const previewBox = container.querySelector(`[data-add-preview="${rtId}"]`);
            if (previewBox) {
              previewBox.innerHTML = renderActionSVG(inferred).replace('width="104" height="104"', 'width="40" height="40"');
            }
          }
        };
      });

      container.querySelectorAll('[data-add-task-form]').forEach(form => {
        form.onsubmit = e => {
          e.preventDefault();
          const rt = (state.routines || []).find(r => r.id === form.dataset.addTaskForm);
          if (!rt) return;
          const fd = new FormData(form);
          const titleVal = String(fd.get('title')).trim();
          const hidden = form.querySelector('[data-add-illus-input]');
          let illusVal = String(fd.get('illus') || 'eat');
          if ((!hidden || hidden.dataset.userPicked !== '1') && illusVal === 'eat') {
            const inferred = inferActionIllusFromTitle(titleVal);
            if (inferred) illusVal = inferred;
          }
          rt.tasks.push({
            id: uid('task'),
            title: titleVal,
            illus: illusVal,
            stars: Math.max(1, Number(fd.get('stars')) || 1),
            daysOfWeek: [0, 1, 2, 3, 4, 5, 6],
            enabled: true
          });
          persistState();
          renderParentView();
          showToast('새 할 일이 추가되었습니다!');
        };
      });
    }

              </div>
            `).join('')}
          </div>
        </div>
      `;

      container.querySelectorAll('[data-fulfill-coupon]').forEach(btn => {
        btn.onclick = () => {
          const cpn = (state.redeemedRewards || []).find(c => c.id === btn.dataset.fulfillCoupon);
          if (!cpn) return;
          cpn.usedAt = seoul.dateKey;
          persistState();
          updateUnreadBadge();
          renderParentView();
          showToast(`✅ '${cpn.title}' 선물 전달 완료 처리되었습니다!`);
        };
      });

      container.querySelectorAll('[data-rw-preset]').forEach(btn => {
        btn.onclick = () => {
          const preset = rewardPresets[Number(btn.dataset.rwPreset)];
          if (!preset) return;
          state.rewards = state.rewards || [];
          state.rewards.push({
            id: uid('rw'),
            icon: preset.icon,
            title: preset.title,
            cost: preset.cost,
            desc: preset.desc,
            enabled: true
          });
          persistState();
          renderParentView();
          showToast(`🎁 '${preset.title}' 보상이 추가되었습니다!`);
        };
      });

      document.getElementById('addRewardForm').onsubmit = e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        state.rewards = state.rewards || [];
        state.rewards.push({
          id: uid('rw'),
          icon: String(fd.get('icon') || '🎁'),
          title: String(fd.get('title')).trim(),
          cost: Math.max(1, Number(fd.get('cost')) || 10),
          desc: String(fd.get('desc') || '').trim(),
          enabled: true
        });
        persistState();
        renderParentView();
        showToast('🎁 새 보상 선물이 상점에 등록되었습니다!');
      };

      container.querySelectorAll('[data-rw-cost]').forEach(btn => {
        btn.onclick = () => {
          const [id, deltaStr] = btn.dataset.rwCost.split(':');
          const rw = (state.rewards || []).find(r => r.id === id);
          if (!rw) return;
          rw.cost = Math.max(1, rw.cost + Number(deltaStr));
          persistState();
          renderParentView();
        };
      });

      container.querySelectorAll('[data-del-reward]').forEach(btn => {
        btn.onclick = () => {
          state.rewards = (state.rewards || []).filter(r => r.id !== btn.dataset.delReward);
          persistState();
          renderParentView();
          showToast('보상 항목이 삭제되었습니다.');
        };
      });
    }

        </p>

          </button>

    function checkDueReminders(seoul) {
      if (activeReminderModalId) return;
      const pinModal = document.getElementById('pinModal');
      const letterModal = document.getElementById('letterModal');
      const rewardModal = document.getElementById('rewardModal');
      if ((pinModal && !pinModal.hidden) || (letterModal && !letterModal.hidden) || (rewardModal && !rewardModal.hidden)) {
        return;
      }

      const nowMins = seoul.hour * 60 + seoul.minute;
      const nowMs = Date.now();
      const reminders = state.reminders || [];

      for (const rem of reminders) {
        if (!rem.enabled) continue;
        if (!Array.isArray(rem.daysOfWeek) || !rem.daysOfWeek.includes(seoul.dow)) continue;

        const dismissKey = `${seoul.dateKey}:${rem.id}`;
        if (state.dismissedReminders && state.dismissedReminders[dismissKey]) continue;

        if (snoozedUntilMap[rem.id] && nowMs < snoozedUntilMap[rem.id]) continue;

        const [rh, rm] = (rem.time || '19:00').split(':').map(Number);
        const remMins = rh * 60 + rm;
        if (nowMins >= remMins && nowMins <= remMins + 180) {
          showReminderPopup(rem, false);
          break;
        }
      }
    }

    let cloudPollCounter = 0;

    function tickMinuteAndRollover() {
      const seoul = getSeoulNowParts();
      if (seoul.dateKey !== activeDateKey) {
        activeDateKey = seoul.dateKey;
        ensureDateRecord(activeDateKey);
        selectedRoutineId = null;
        snoozedUntilMap = {};
        persistState();
        if (currentRoute === 'today') renderTodayDashboard();
        showToast('🌞 새로운 하루가 시작되었어요! 오늘도 화이팅!');
      }

      const clockEl = document.getElementById('liveDigitalClock');
      if (clockEl) {
        clockEl.innerHTML = formatClock12HourHTML(seoul.hour, seoul.minute);
      }

      if (currentRoute === 'today' && selectedRoutineId) {
        const currentRoutine = state.routines.find(r => r.id === selectedRoutineId);
        if (currentRoutine) {
          const tasks = getTasksForRoutineAndDay(currentRoutine, seoul.dow);
          const record = state.dailyRecords[seoul.dateKey] || { completedTaskIds: {} };
          const countdownEl = document.getElementById('routineCountdownText');
          if (countdownEl) {
            countdownEl.outerHTML = buildRoutineCountdownHTML(currentRoutine, tasks, record, seoul);
          }
        }
      }

      updateUnreadBadge();
      checkDueReminders(seoul);

      cloudPollCounter++;
      if (cloudPollCounter >= 4 && isCloudSyncConfigured()) {
        cloudPollCounter = 0;
        pullFromCloud(false);
      }
    }

    function buildRoutineCountdownHTML(currentRoutine, tasks, record, seoul) {
      const completedCount = tasks.filter(t => Boolean(record.completedTaskIds[t.id])).length;
      const totalCount = tasks.length;
      if (totalCount > 0 && completedCount === totalCount) {
        return `<span id="routineCountdownText" class="countdown-text gentle-overtime">🎉 ${escapeHTML(currentRoutine.name)} 모두 완료했어요!</span>`;
      }
      const [th, tm] = (currentRoutine.targetTime || '08:30').split(':').map(Number);
      const nowMins = seoul.hour * 60 + seoul.minute;
      const targetMins = th * 60 + tm;
      const diff = targetMins - nowMins;
      if (diff > 0) {
        const hrs = Math.floor(diff / 60);
        const mins = diff % 60;
        const timeLabel = hrs > 0 ? `${hrs}시간 ${mins}분` : `${mins}분`;
        return `<span id="routineCountdownText" class="countdown-text">⏰ ${escapeHTML(currentRoutine.name)}까지 <strong>${timeLabel}</strong> 남았어요!</span>`;
      }
      return `<span id="routineCountdownText" class="countdown-text gentle-overtime">🌿 괜찮아! 남은 일을 하나씩 마무리해 보자.</span>`;
    }

    }

    function updatePinDots() {
      const dots = document.querySelectorAll('#pinDots .pin-dot');
      dots.forEach((d, idx) => d.classList.toggle('filled', idx < pinBuffer.length));
    }

    function initPinKeypad() {
      const pad = document.getElementById('pinKeypad');
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '초기화', '0', '←'];
      pad.innerHTML = keys.map(k => `<button type="button" class="pin-key" data-pkey="${k}">${k}</button>`).join('');

      pad.querySelectorAll('.pin-key').forEach(btn => {
        btn.onclick = () => {
          const val = btn.dataset.pkey;
          if (val === '초기화') {
            pinBuffer = '';
          } else if (val === '←') {
            pinBuffer = pinBuffer.slice(0, -1);
          } else if (pinBuffer.length < 4) {
            pinBuffer += val;
          }
          updatePinDots();

          if (pinBuffer.length === 4) {
            if (pinBuffer === state.household.parentPin) {
              document.getElementById('pinModal').hidden = true;
              parentUnlocked = true;
              navigateTo('parent');
            } else {
              document.getElementById('pinErrorMsg').textContent = '비밀번호가 일치하지 않아요. 다시 눌러주세요.';
              pinBuffer = '';
              setTimeout(updatePinDots, 250);
            }
          }
        };
      });

      document.getElementById('closePinModalBtn').onclick = () => {
        document.getElementById('pinModal').hidden = true;
      };
    }

    let wakeLockSentinel = null;
    async function applyWakeLock() {
      if (!state.settings.wakeLockEnabled) {
        if (wakeLockSentinel) {
          try { await wakeLockSentinel.release(); } catch (e) {}
          wakeLockSentinel = null;
        }
        return;
      }
      if (!('wakeLock' in navigator)) {
        state.settings.wakeLockEnabled = false;
        showToast('이 브라우저에서는 화면 절전 방지를 지원하지 않습니다.');
        return;
      }
      try {
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        showToast('💡 태블릿 화면 켜짐 유지가 활성화되었습니다.');
      } catch (e) {
        state.settings.wakeLockEnabled = false;
        showToast('화면 절전 방지를 켤 수 없습니다.');
      }
    }

    function applyVisualSettings() {
      document.documentElement.setAttribute('data-theme', state.settings.nightMode ? 'night' : 'day');
      document.documentElement.setAttribute('data-reduced-motion', state.settings.reducedMotion ? 'true' : 'false');
    }

    function updateSyncBadge() {
      const pill = document.getElementById('syncPill');
      const lbl = document.getElementById('syncLabel');
      if (!pill || !lbl) return;
      pill.classList.remove('offline', 'cloud');
      if (!navigator.onLine) {
        pill.classList.add('offline');
        lbl.textContent = '오프라인 저장';
      } else if (isCloudSyncConfigured()) {
        pill.classList.add('cloud');
        lbl.textContent = cloudSyncStatus === 'syncing' ? '동기화 중...' : cloudSyncStatus === 'error' ? '동기화 확인' : '클라우드 동기화';
      } else {
        lbl.textContent = '저장됨';
      }
    }

    let toastTimer = null;
    function showToast(msg) {
      const banner = document.getElementById('toastBanner');
      if (!banner) return;
      banner.textContent = msg;
      banner.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { banner.hidden = true; }, 3200);
    }

    function escapeHTML(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    function hasBatchim(word) {
      const s = String(word || '').trim();
      if (!s) return false;
      const code = s.charCodeAt(s.length - 1);
      if (code < 0xAC00 || code > 0xD7A3) return false;
      return (code - 0xAC00) % 28 !== 0;
    }

    function formatKoreanVocative(name) {
      const s = String(name || '예린').trim();
      return s + (hasBatchim(s) ? '아' : '야');
    }

    function formatKoreanPossessive(name) {
      const s = String(name || '예린').trim();
      return s + (hasBatchim(s) ? '이의' : '의');
    }

    /* ==========================================================================
       18. APPLICATION BOOTSTRAP
       ========================================================================== */
    async function bootstrap() {
      registerPWA();
      initPinKeypad();
      await initPersistence();

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.onclick = () => navigateTo(btn.dataset.nav);
      });

      window.addEventListener('online', () => {
        updateSyncBadge();
        fetchWeather(true);
        if (isCloudSyncConfigured()) pullFromCloud(false);
      });
      window.addEventListener('offline', () => { updateSyncBadge(); if (currentRoute === 'today') renderTodayDashboard(); });
      window.addEventListener('storage', e => {
        if (e.key === STORAGE_KEY && e.newValue) {
          try {
            state = migrateAndNormalizeState(JSON.parse(e.newValue));
            applyVisualSettings();
            updateUnreadBadge();
            navigateTo(currentRoute);
          } catch (err) {}
        }
      });

      updateSyncBadge();
      if (isCloudSyncConfigured()) pullFromCloud(true);
      updateUnreadBadge();
      renderTodayDashboard();
      fetchWeather();
      checkDueReminders(getSeoulNowParts());

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          tickMinuteAndRollover();
          if (isCloudSyncConfigured()) pullFromCloud(false);
        }
      });

      const msUntilNextSecond = 1000 - (Date.now() % 1000);
      setTimeout(() => {
        tickMinuteAndRollover();
        setInterval(tickMinuteAndRollover, 1000);
      }, msUntilNextSecond);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  })();
  </script>
</body>
</html>
